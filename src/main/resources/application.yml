testgen:
  queue-capacity: 10
  projects:
    fit-bench:
      path: examples/fit-bench
  work-root: target/server-work
  defaults:
    seed: 0
    max-candidates: 50
    initial-candidates: 10
    mutated-initial-candidates: 3
    max-values-per-slot: 10
  runner:
    timeout-seconds: 120

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
