testgen:
  queue-capacity: 10
  projects:
    fit-bench:
      path: examples/fit-bench
  work-root: target/server-work
  defaults:
    seed: 0
    max-candidates: 50
    initial-candidates: 10
    mutated-initial-candidates: 3
    max-values-per-slot: 10
  runner:
    timeout-seconds: 120
  messaging:
    job-requests-topic: testgen.jobs.requests
    job-requests-partitions: 3

spring:
  datasource:
    url: jdbc:postgresql://localhost:${TESTGEN_POSTGRES_PORT:5432}/testgen
    username: testgen
    password: ${TESTGEN_POSTGRES_PASSWORD:testgen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:${TESTGEN_KAFKA_PORT:9092}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
