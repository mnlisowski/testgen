testgen:
  queue-capacity: 10
  projects:
    fit-bench:
      path: examples/fit-bench
  work-root: target/server-work
  defaults:
    seed: 0
    max-candidates: 50
    initial-candidates: 10
    mutated-initial-candidates: 3
    max-values-per-slot: 10
  runner:
    timeout-seconds: 120

spring:
  profiles:
    default: in-memory
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
