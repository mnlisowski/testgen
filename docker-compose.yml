services:
  postgres:
    image: postgres:17
    profiles: [database]
    environment:
      POSTGRES_DB: testgen
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: ${TESTGEN_POSTGRES_PASSWORD:-testgen}
    ports:
      - "127.0.0.1:${TESTGEN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen -d testgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single Kafka node in KRaft mode: the same process is both broker and controller,
  # so no ZooKeeper is needed.
  kafka:
    image: apache/kafka:4.1.0
    profiles: [messaging]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: testgen-local-kafka-01
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by other containers (kafka:29092), HOST by applications started
      # on the host machine (localhost:9092), CONTROLLER by KRaft itself.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${TESTGEN_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker cannot keep more than one copy of Kafka's internal topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the application with explicit settings, not by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${TESTGEN_KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    profiles: [messaging]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: testgen-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:${TESTGEN_KAFKA_UI_PORT:-8085}:8080"

  prepare-profile:
    build: .
    image: testgen
    command:
      - prepare-profile
      - /project
      - /profile-work
    volumes:
      - ./examples/fit-bench:/project:ro
      - ./target/docker-profile-work/fit-bench:/profile-work
      - ./target/docker-m2:/root/.m2

  record-profile:
    image: testgen
    entrypoint:
      - java
    command:
      - -Dtestgen.profile.dir=/profile-work
      - -cp
      - /profile-work/classes:/app/target/classes:/app/target/dependency/*
      - sample.fit.DemoMain
    volumes:
      - ./target/docker-profile-work/fit-bench:/profile-work

  generate-tests:
    image: testgen
    command:
      - /project
      - /test-work
    volumes:
      - ./examples/fit-bench:/project:ro
      - ./target/test-work/fit-bench:/test-work
      - ./target/docker-m2:/root/.m2

  generate-tests-with-profile:
    image: testgen
    command:
      - /project
      - /test-work
      - /project/observed-profile.txt
    volumes:
      - ./examples/fit-bench:/project:ro
      - ./target/test-work/fit-bench-with-profile:/test-work
      - ./target/docker-m2:/root/.m2

volumes:
  postgres-data:
