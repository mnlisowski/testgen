services:
  postgres:
    image: postgres:17
    profiles: [database]
    environment:
      POSTGRES_DB: testgen
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: ${TESTGEN_POSTGRES_PASSWORD:-testgen}
    ports:
      - "127.0.0.1:${TESTGEN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen -d testgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  prepare-profile:
    build: .
    image: testgen
    command:
      - prepare-profile
      - /project
      - /profile-work
    volumes:
      - ./examples/fit-bench:/project:ro
      - ./target/docker-profile-work/fit-bench:/profile-work
      - ./target/docker-m2:/root/.m2

  record-profile:
    image: testgen
    entrypoint:
      - java
    command:
      - -Dtestgen.profile.dir=/profile-work
      - -cp
      - /profile-work/classes:/app/target/classes:/app/target/dependency/*
      - sample.fit.DemoMain
    volumes:
      - ./target/docker-profile-work/fit-bench:/profile-work

  generate-tests:
    image: testgen
    command:
      - /project
      - /test-work
    volumes:
      - ./examples/fit-bench:/project:ro
      - ./target/test-work/fit-bench:/test-work
      - ./target/docker-m2:/root/.m2

  generate-tests-with-profile:
    image: testgen
    command:
      - /project
      - /test-work
      - /project/observed-profile.txt
    volumes:
      - ./examples/fit-bench:/project:ro
      - ./target/test-work/fit-bench-with-profile:/test-work
      - ./target/docker-m2:/root/.m2

volumes:
  postgres-data:
